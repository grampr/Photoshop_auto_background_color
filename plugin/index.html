<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="src/ui/panel.css" />
  </head>
  <body>
    <main>
      <h1>ローカル自動色合わせ</h1>
      <section class="field">
        <label>前景レイヤー</label>
        <div class="row"><span id="foregroundName">未設定</span><button id="setForeground">選択中を設定</button></div>
        <label for="foregroundLayer" class="sub-label">候補から直接選択</label>
        <select id="foregroundLayer"></select>
      </section>
      <section class="field">
        <label>背景レイヤー</label>
        <div class="row"><span id="backgroundName">未設定</span><button id="setBackground">選択中を設定</button></div>
        <label for="backgroundLayer" class="sub-label">候補から直接選択</label>
        <select id="backgroundLayer"></select>
        <button id="refreshLayers" class="secondary wide">レイヤー候補を更新</button>
      </section>
      <div class="actions primary-actions">
        <button id="analyze">解析</button>
        <button id="preview">プレビュー</button>
        <button id="apply">適用</button>
        <button id="reset" class="secondary">リセット</button>
      </div>
      <div id="activity" class="status-card idle" role="status" aria-live="polite">
        <span class="status-indicator" aria-hidden="true"></span>
        <div class="status-copy">
          <div id="status">準備中</div>
          <div id="statusDetail">処理待ち</div>
        </div>
      </div>
      <section class="field">
        <div class="row"><label for="strength">補正の強さ</label><output id="strengthValue">55%</output></div>
        <input id="strength" type="range" min="0" max="100" value="55" />
      </section>
      <fieldset>
        <legend>合わせる項目</legend>
        <div id="matchOptions" class="checks">
          <label><input type="checkbox" data-key="exposure" checked /> 露出</label>
          <label><input type="checkbox" data-key="temperature" checked /> 色温度</label>
          <label><input type="checkbox" data-key="tint" checked /> 色かぶり</label>
          <label><input type="checkbox" data-key="contrast" checked /> コントラスト</label>
          <label><input type="checkbox" data-key="saturation" checked /> 彩度</label>
          <label><input type="checkbox" data-key="shadows" checked /> シャドウ</label>
          <label><input type="checkbox" data-key="midtones" checked /> 中間調</label>
          <label><input type="checkbox" data-key="highlights" checked /> ハイライト</label>
        </div>
      </fieldset>
      <section class="field">
        <label for="mode">処理モード</label>
        <select id="mode">
          <option value="fast">高速 — OpenCVのみ</option>
          <option value="balanced" selected>バランス — OpenCV＋AI</option>
          <option value="ai">AI優先 — Harmonizer</option>
        </select>
      </section>
      <button id="startBackend" class="secondary wide">ローカルAIを起動</button>
      <pre id="results">前景と背景を設定して解析してください。</pre>
    </main>
    <script src="main.js"></script>
  </body>
</html>
